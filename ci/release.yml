name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Compilar Binários Estáticos
        run: |
          VERSION=${GITHUB_REF_NAME:-dev}
          make package-all VERSION="${VERSION}"

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/0itotrade-supervisor-linux-amd64.tar.gz
            dist/0itotrade-supervisor-linux-arm64.tar.gz
            dist/0itotrade-supervisor-linux-amd64
            dist/0itotrade-supervisor-linux-arm64
            dist/0itotrade-supervisor-windows-amd64.tar.gz
            dist/0itotrade-supervisor-windows-arm64.tar.gz
            dist/0itotrade-supervisor-windows-amd64.exe
            dist/0itotrade-supervisor-windows-arm64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
